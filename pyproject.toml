[project]
name = "fastapi-questions"
version = "0.1.0"
description = "API de preguntas con FastAPI y Hugging Face"
authors = [
    {name = "Aetther",email = "gonza_ale@live.com"}
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi (>=0.143.0,<0.144.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "sqlalchemy (>=2.1.4,<3.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "pyarrow (>=26.0.0,<27.0.0)",
    "requests (>=2.34.2,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
pythonpath = ["."]