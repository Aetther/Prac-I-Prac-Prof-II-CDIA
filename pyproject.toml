[project]
name = "fastapi-questions"
version = "0.1.0"
description = "API de preguntas con FastAPI y Hugging Face"
authors = [
    {name = "Aetther",email = "gonza_ale@live.com"}
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi (>=0.143.0,<0.144.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "sqlalchemy (>=2.1.4,<3.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "pyarrow (>=26.0.0,<27.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "transformers (>=5.19.0,<6.0.0)",
    "torch (>=2.14.1,<3.0.0)",
    "sentence-transformers (>=6.1.0,<7.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "tqdm (>=4.70.1,<5.0.0)",
    "ftfy (>=6.3.1,<7.0.0)",
    "setfit (>=1.2.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "unit: funciones aisladas, sin base de datos ni modelos de IA",
    "integration: varias piezas juntas (API + base de prueba)",
    "data_quality: reglas sobre los datos reales (requiere PostgreSQL con datos)",
    "validation: validación de entradas de la API y de la calidad del modelo",
    "slow: carga modelos de IA; no corre por defecto (usar -m slow)",
]
addopts = "-m \"not slow\""
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:`torch.jit.script` is deprecated:FutureWarning",
]